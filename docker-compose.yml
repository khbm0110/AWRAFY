services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: awrafy
      POSTGRES_PASSWORD: awrafy_dev_password
      POSTGRES_DB: awrafy_dev
    ports:
      - "5432:5432"
    volumes:
      - awrafy_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - awrafy_redis_data:/data

volumes:
  awrafy_postgres_data:
  awrafy_redis_data:
